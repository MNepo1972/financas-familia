<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f13;--bg2:#16161c;--bg3:#1e1e27;--bg4:#26262f;--accent:#6c63ff;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--text:#f0f0f5;--text2:#a0a0b0;--text3:#606070;--border:#2a2a35;--border2:#35353f;--r:12px;--r2:8px;--r3:20px}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:15px}
h2{font-size:13px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:40px 32px;width:100%;max-width:360px;text-align:center}
.login-logo{font-size:40px;margin-bottom:16px}
.login-title{font-size:22px;font-weight:600;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:32px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px;background:#fff;border:none;border-radius:var(--r2);color:#1f1f1f;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .2s}
.btn-google:hover{opacity:.9}
.btn-google img{width:20px;height:20px}
#loginError{margin-top:14px;font-size:12px;color:var(--red);display:none}
#appScreen{display:none}
.app{max-width:700px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:4px;background:var(--bg2);border-radius:var(--r3);padding:4px;margin-bottom:20px;border:1px solid var(--border)}
.tab{flex:1;padding:9px 0;border:none;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:16px;cursor:pointer;transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.section{display:none}.section.active{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-sm{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px;text-align:center}
.kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi-value{font-family:'DM Mono',monospace;font-size:18px;font-weight:500}
.kpi-value.pos{color:var(--green)}.kpi-value.neg{color:var(--red)}
.prog-wrap{margin-bottom:16px}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px}
.prog-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .5s}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
input,select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
select option{background:var(--bg3)}
.toggle-type{display:flex;gap:6px;margin-bottom:10px}
.btn-type{flex:1;padding:9px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);border-radius:var(--r2);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .2s}
.btn-type.active-rec{background:#14532d;border-color:var(--green);color:var(--green)}
.btn-type.active-desp{background:#450a0a;border-color:var(--red);color:var(--red)}
.btn-primary{width:100%;padding:12px;background:var(--accent);border:none;border-radius:var(--r2);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.85}
.btn-ghost{background:transparent;border:1px solid var(--border2);border-radius:var(--r2);padding:6px 12px;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.lancamento{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:6px}
.lanc-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.lanc-info{flex:1;min-width:0}
.lanc-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanc-meta{font-size:11px;color:var(--text3);margin-top:2px}
.lanc-valor{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;flex-shrink:0}
.lanc-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:4px;font-size:12px;transition:color .2s;flex-shrink:0}
.lanc-del:hover{color:var(--red)}
.fixa-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:6px}
.fixa-status{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fixa-nome{flex:1;font-size:14px}
.fixa-dia{font-size:11px;color:var(--text3)}
.fixa-valor{font-family:'DM Mono',monospace;font-size:13px;color:var(--text2);margin-right:8px}
.badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-ok{background:#14532d;color:var(--green)}.badge-pend{background:#451a03;color:var(--amber)}.badge-atras{background:#450a0a;color:var(--red)}
.chart-wrap{position:relative;width:100%;height:220px;margin-bottom:4px}
.cat-bar{margin-bottom:10px}
.cat-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.filtros{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filtros select{width:auto;flex:1;min-width:120px}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r2);margin-bottom:8px;font-size:13px}
.alerta-warn{background:#451a03;border:1px solid #92400e}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:20px;width:100%;max-width:420px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer}
.empty{text-align:center;padding:32px 16px;color:var(--text3)}
.empty i{font-size:32px;margin-bottom:8px;display:block}
.empty p{font-size:13px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:480px){.kpi-value{font-size:15px}.form-grid{grid-template-columns:1fr}.tab{font-size:11px}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">💰</div>
    <div class="login-title">Finanças Família</div>
    <div class="login-sub">Acesso restrito. Entre com sua conta Google.</div>
    <button class="btn-google" onclick="fazerLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
      Entrar com Google
    </button>
    <div id="loginError">Acesso não autorizado para esta conta.</div>
  </div>
</div>

<div id="appScreen">
  <div class="app">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:20px;font-weight:600">Finanças <span style="color:var(--accent)">Família</span></div>
        <div style="font-size:12px;color:var(--text3)" id="headerDate"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-ghost" onclick="exportarDados()"><i class="fa fa-download" style="margin-right:6px"></i>Exportar</button>
        <button class="btn-ghost" onclick="fazerLogout()" title="Sair"><i class="fa fa-right-from-bracket"></i></button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="setTab('inicio',this)"><i class="fa fa-house" style="margin-right:5px"></i>Início</button>
      <button class="tab" onclick="setTab('lancamentos',this)"><i class="fa fa-plus" style="margin-right:5px"></i>Lançar</button>
      <button class="tab" onclick="setTab('fixas',this)"><i class="fa fa-repeat" style="margin-right:5px"></i>Fixas</button>
      <button class="tab" onclick="setTab('historico',this)"><i class="fa fa-clock-rotate-left" style="margin-right:5px"></i>Histórico</button>
    </div>

    <div class="section active" id="tab-inicio">
      <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center">
        <select id="selMesInicio" onchange="renderInicio()" style="flex:1"></select>
        <select id="selAnoInicio" onchange="renderInicio()" style="width:90px"></select>
      </div>
      <div class="kpi-grid" id="kpiRow"></div>
      <div class="prog-wrap" id="progWrap"></div>
      <div id="alertasWrap"></div>
      <div class="card" style="margin-bottom:12px">
        <h2><i class="fa fa-chart-line" style="margin-right:6px;color:var(--accent)"></i>Receita x Despesa</h2>
        <div class="chart-wrap"><canvas id="chartMensal" role="img" aria-label="Gráfico receita vs despesa">Comparativo mensal.</canvas></div>
      </div>
      <div class="card">
        <h2><i class="fa fa-chart-pie" style="margin-right:6px;color:var(--accent)"></i>Despesas por categoria</h2>
        <div id="catBars"></div>
      </div>
    </div>

    <div class="section" id="tab-lancamentos">
      <div class="card">
        <h2>Novo lançamento</h2>
        <div class="toggle-type">
          <button class="btn-type active-rec" id="btnRec" onclick="setTipo('Receita')"><i class="fa fa-arrow-up" style="margin-right:6px"></i>Receita</button>
          <button class="btn-type" id="btnDesp" onclick="setTipo('Despesa')"><i class="fa fa-arrow-down" style="margin-right:6px"></i>Despesa</button>
        </div>
        <div class="form-grid">
          <div><label>Data</label><input type="date" id="fData"></div>
          <div><label>Valor (R$)</label><input type="number" id="fValor" placeholder="0,00" step="0.01" min="0"></div>
          <div class="form-full"><label>Descrição</label><input type="text" id="fDesc" placeholder="Ex: Salário, Supermercado..."></div>
          <div class="form-full"><label>Categoria</label><select id="fCat"></select></div>
          <div><label>Mês referência</label><select id="fMesRef"></select></div>
          <div><label>Ano referência</label><select id="fAnoRef"></select></div>
        </div>
        <button class="btn-primary" onclick="salvarLancamento()"><i class="fa fa-check" style="margin-right:8px"></i>Salvar lançamento</button>
      </div>
      <div class="card">
        <h2>Lançamentos de hoje</h2>
        <div id="lancHoje"></div>
      </div>
    </div>

    <div class="section" id="tab-fixas">
      <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center">
        <select id="selMesFixas" onchange="renderFixas()" style="flex:1"></select>
        <select id="selAnoFixas" onchange="renderFixas()" style="width:90px"></select>
        <button class="btn-ghost" onclick="abrirModalFixa(null)"><i class="fa fa-plus" style="margin-right:4px"></i>Nova</button>
      </div>
      <div id="listaFixas"></div>
      <div class="card" style="margin-top:4px"><h2>Resumo fixas do mês</h2><div id="resumoFixas"></div></div>
    </div>

    <div class="section" id="tab-historico">
      <div class="filtros">
        <select id="filtMes"></select>
        <select id="filtAno"></select>
        <select id="filtTipo"><option value="">Todos os tipos</option><option value="Receita">Receitas</option><option value="Despesa">Despesas</option></select>
        <select id="filtCat"><option value="">Todas as categorias</option></select>
      </div>
      <div id="listaHist"></div>
      <div id="totalHist" style="text-align:right;font-size:13px;color:var(--text2);margin-top:8px"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalFixa">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalFixaTitulo">Nova conta fixa</span>
      <button class="modal-close" onclick="fecharModal()">x</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="grid-column:1/-1"><label>Nome da conta</label><input type="text" id="mfNome" placeholder="Ex: Aluguel, Netflix..."></div>
      <div><label>Valor (R$)</label><input type="number" id="mfValor" step="0.01" min="0"></div>
      <div><label>Dia vencimento</label><input type="number" id="mfDia" min="1" max="31" placeholder="Ex: 10"></div>
      <div style="grid-column:1/-1"><label>Categoria</label><select id="mfCat"></select></div>
    </div>
    <button class="btn-primary" style="margin-top:14px" onclick="salvarFixa()">Salvar</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCCTWDCraooT1UQlcxBgHZBFXdmV2vyzj8",authDomain:"controle-financeiro-pess-32e1e.firebaseapp.com",projectId:"controle-financeiro-pess-32e1e",storageBucket:"controle-financeiro-pess-32e1e.firebasestorage.app",messagingSenderId:"134030628633",appId:"1:134030628633:web:6440f1721fedc056161788",databaseURL:"https://controle-financeiro-pess-32e1e-default-rtdb.firebaseio.com"};

// === COLOQUE SEU UID AQUI APOS O PRIMEIRO LOGIN ===
const UID_AUTORIZADO="SEU_UID_AQUI";

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
let dbRef=null;
let cacheFixas={};
let cachePagamentos={};
let tipoAtivo='Receita';
let editandoFixaKey=null;
let chartMensal=null;

const MESES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const MESES_FULL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATS_REC=['Salário CLT','Renda Extra','Freelance','Investimentos','Outros (Receita)'];
const CATS_DESP=['Moradia','Alimentação','Transporte','Educação','Saúde','Lazer','Vestuário','Assinaturas','Outros (Despesa)'];
const CAT_CORES={'Moradia':'#6c63ff','Alimentação':'#22c55e','Transporte':'#f59e0b','Educação':'#3b82f6','Saúde':'#ec4899','Lazer':'#a78bfa','Vestuário':'#fb923c','Assinaturas':'#06b6d4','Outros (Despesa)':'#64748b','Salário CLT':'#22c55e','Renda Extra':'#a3e635','Freelance':'#34d399','Investimentos':'#60a5fa','Outros (Receita)':'#94a3b8'};

auth.onAuthStateChanged(user=>{
  if(user){
    if(UID_AUTORIZADO!=="SEU_UID_AQUI"&&user.uid!==UID_AUTORIZADO){
      document.getElementById('loginError').style.display='block';
      auth.signOut();return;
    }
    dbRef=db.ref('usuarios/'+user.uid);
    iniciarApp();
  } else {
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('appScreen').style.display='none';
  }
});

function fazerLogin(){
  const p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(()=>{
    const el=document.getElementById('loginError');
    el.style.display='block';el.textContent='Erro ao fazer login. Tente novamente.';
  });
}
function fazerLogout(){if(confirm('Sair?'))auth.signOut();}

function dbGet(path){return dbRef.child(path).get().then(s=>s.exists()?s.val():null);}
function dbSet(path,val){return dbRef.child(path).set(val);}
function dbPush(path,val){return dbRef.child(path).push(val);}
function dbRemove(path){return dbRef.child(path).remove();}

function fmtMoeda(v){return'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtData(d){if(!d)return'';const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function hoje(){return new Date().toISOString().split('T')[0];}

function mostrarToast(msg,cor='#22c55e'){
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:20px;right:20px;background:${cor};color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;transition:opacity .3s`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2000);
}

function populateCatSelect(id,tipo){
  const el=document.getElementById(id);if(!el)return;
  const cats=tipo==='Receita'?CATS_REC:CATS_DESP;
  el.innerHTML=cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function populateSelects(){
  const anos=[];for(let y=2020;y<=new Date().getFullYear()+1;y++)anos.push(y);
  ['selMesInicio','selMesFixas','filtMes','fMesRef'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.innerHTML=MESES_FULL.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
    el.value=new Date().getMonth();
  });
  ['selAnoInicio','selAnoFixas','filtAno','fAnoRef'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.innerHTML=anos.map(y=>`<option value="${y}">${y}</option>`).join('');
    el.value=new Date().getFullYear();
  });
  populateCatSelect('fCat',tipoAtivo);
  populateCatSelect('mfCat','Despesa');
  const fc=document.getElementById('filtCat');
  fc.innerHTML='<option value="">Todas as categorias</option>'+[...CATS_REC,...CATS_DESP].map(c=>`<option value="${c}">${c}</option>`).join('');
  document.getElementById('fData').value=hoje();
}

function iniciarApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('headerDate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  populateSelects();
  dbRef.child('fixas').on('value',snap=>{cacheFixas=snap.val()||{};renderFixas();});
  dbRef.child('pagamentos').on('value',snap=>{cachePagamentos=snap.val()||{};renderFixas();});
  renderInicio();renderLancHoje();
  ['filtMes','filtAno','filtTipo','filtCat'].forEach(id=>{document.getElementById(id).addEventListener('change',renderHistorico);});
}

function setTab(t,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(btn)btn.classList.add('active');
  if(t==='inicio')renderInicio();
  if(t==='historico')renderHistorico();
  if(t==='fixas')renderFixas();
  if(t==='lancamentos')renderLancHoje();
}

function setTipo(t){
  tipoAtivo=t;
  document.getElementById('btnRec').className='btn-type'+(t==='Receita'?' active-rec':'');
  document.getElementById('btnDesp').className='btn-type'+(t==='Despesa'?' active-desp':'');
  populateCatSelect('fCat',t);
}

async function getLancamentos(){const val=await dbGet('lancamentos');if(!val)return[];return Object.entries(val).map(([k,v])=>({...v,_key:k}));}
async function getLancsMes(mes,ano){const all=await getLancamentos();return all.filter(l=>l.mesRef===mes&&l.anoRef===ano);}

async function salvarLancamento(){
  const data=document.getElementById('fData').value;
  const valor=parseFloat(document.getElementById('fValor').value);
  const desc=document.getElementById('fDesc').value.trim();
  const cat=document.getElementById('fCat').value;
  const mesRef=parseInt(document.getElementById('fMesRef').value);
  const anoRef=parseInt(document.getElementById('fAnoRef').value);
  if(!data||!valor||!desc){mostrarToast('Preencha data, valor e descrição.','#ef4444');return;}
  await dbPush('lancamentos',{data,valor,desc,cat,tipo:tipoAtivo,mesRef,anoRef,criadoEm:Date.now()});
  document.getElementById('fValor').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('fData').value=hoje();
  mostrarToast('Lançamento salvo!');
  renderLancHoje();renderInicio();
}

async function deletarLanc(key){
  if(!confirm('Remover este lançamento?'))return;
  await dbRemove('lancamentos/'+key);
  mostrarToast('Removido.','#ef4444');
  renderLancHoje();renderHistorico();renderInicio();
}

async function renderLancHoje(){
  const h=hoje();const all=await getLancamentos();
  const lancs=all.filter(l=>l.data===h).reverse();
  const el=document.getElementById('lancHoje');
  if(!lancs.length){el.innerHTML='<div class="empty"><i class="fa fa-receipt"></i><p>Nenhum lançamento hoje</p></div>';return;}
  el.innerHTML=lancs.map(l=>`<div class="lancamento"><div class="lanc-icon" style="background:${l.tipo==='Receita'?'#14532d':'#450a0a'}"><i class="fa ${l.tipo==='Receita'?'fa-arrow-up':'fa-arrow-down'}" style="color:${l.tipo==='Receita'?'#22c55e':'#ef4444'}"></i></div><div class="lanc-info"><div class="lanc-desc">${l.desc}</div><div class="lanc-meta">${l.cat} · ${fmtData(l.data)}</div></div><div class="lanc-valor" style="color:${l.tipo==='Receita'?'#22c55e':'#ef4444'}">${l.tipo==='Receita'?'+':'-'}${fmtMoeda(l.valor)}</div><button class="lanc-del" onclick="deletarLanc('${l._key}')"><i class="fa fa-trash"></i></button></div>`).join('');
}

async function renderInicio(){
  const mes=parseInt(document.getElementById('selMesInicio').value);
  const ano=parseInt(document.getElementById('selAnoInicio').value);
  const lancs=await getLancsMes(mes,ano);
  const rec=lancs.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+l.valor,0);
  const desp=lancs.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+l.valor,0);
  const saldo=rec-desp;const pct=rec>0?Math.min(100,Math.round((desp/rec)*100)):0;
  document.getElementById('kpiRow').innerHTML=`<div class="kpi"><div class="kpi-label">Receita</div><div class="kpi-value pos">${fmtMoeda(rec)}</div></div><div class="kpi"><div class="kpi-label">Despesa</div><div class="kpi-value neg">${fmtMoeda(desp)}</div></div><div class="kpi"><div class="kpi-label">Saldo</div><div class="kpi-value ${saldo>=0?'pos':'neg'}">${fmtMoeda(saldo)}</div></div>`;
  const cor=pct<60?'#22c55e':pct<85?'#f59e0b':'#ef4444';
  document.getElementById('progWrap').innerHTML=`<div class="prog-label"><span style="font-size:13px">Comprometimento da renda</span><span style="color:${cor};font-weight:600">${pct}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${cor}"></div></div>`;
  let alertas='';
  const keyMes=`${ano}-${String(mes).padStart(2,'0')}`;
  const fixasArr=Object.entries(cacheFixas).map(([k,v])=>({...v,_key:k}));
  const pendentes=fixasArr.filter(f=>!cachePagamentos[keyMes]?.[f._key]);
  if(pendentes.length)alertas+=`<div class="alerta alerta-warn"><i class="fa fa-triangle-exclamation" style="color:#f59e0b"></i><span><strong>${pendentes.length} conta(s) fixa(s) pendente(s)</strong> em ${MESES_FULL[mes]}.</span></div>`;
  if(saldo<0)alertas+=`<div class="alerta alerta-warn"><i class="fa fa-circle-exclamation" style="color:#ef4444"></i><span>Saldo <strong>negativo</strong> em ${MESES_FULL[mes]}. Diferença: ${fmtMoeda(Math.abs(saldo))}.</span></div>`;
  if(pct>85&&pct<=100)alertas+=`<div class="alerta alerta-warn"><i class="fa fa-fire" style="color:#f59e0b"></i><span>Mais de 85% da renda comprometida.</span></div>`;
  document.getElementById('alertasWrap').innerHTML=alertas;
  await renderChartMensal(mes,ano);
  renderCatBars(lancs);
}

async function renderChartMensal(mesSel,anoSel){
  const todos=await Promise.all(MESES.map((_,i)=>getLancsMes(i,anoSel)));
  const recs=todos.map(l=>l.filter(x=>x.tipo==='Receita').reduce((s,x)=>s+x.valor,0));
  const desps=todos.map(l=>l.filter(x=>x.tipo==='Despesa').reduce((s,x)=>s+x.valor,0));
  if(chartMensal)chartMensal.destroy();
  chartMensal=new Chart(document.getElementById('chartMensal').getContext('2d'),{type:'bar',data:{labels:MESES,datasets:[{label:'Receita',data:recs,backgroundColor:recs.map((_,i)=>i===mesSel?'#22c55e':'#1a3a2a'),borderRadius:4},{label:'Despesa',data:desps,backgroundColor:desps.map((_,i)=>i===mesSel?'#ef4444':'#3a1a1a'),borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtMoeda(c.parsed.y)}}},scales:{x:{grid:{color:'#1e1e27'},ticks:{color:'#606070',font:{size:11}}},y:{grid:{color:'#1e1e27'},ticks:{color:'#606070',font:{size:11},callback:v=>'R$'+Math.round(v/1000)+'k'}}}}});
}

function renderCatBars(lancs){
  const despesas=lancs.filter(l=>l.tipo==='Despesa');
  const totais={};despesas.forEach(l=>{totais[l.cat]=(totais[l.cat]||0)+l.valor;});
  const total=Object.values(totais).reduce((s,v)=>s+v,0);
  const sorted=Object.entries(totais).sort((a,b)=>b[1]-a[1]);
  if(!sorted.length){document.getElementById('catBars').innerHTML='<div class="empty"><i class="fa fa-chart-pie"></i><p>Sem despesas neste mês</p></div>';return;}
  document.getElementById('catBars').innerHTML=sorted.map(([cat,val])=>{
    const pct=total>0?Math.round((val/total)*100):0;
    const cor=CAT_CORES[cat]||'#6c63ff';
    return`<div class="cat-bar"><div class="cat-header"><span>${cat}</span><span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text2)">${fmtMoeda(val)} · ${pct}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${cor}"></div></div></div>`;
  }).join('');
}

function renderFixas(){
  const mes=parseInt(document.getElementById('selMesFixas').value);
  const ano=parseInt(document.getElementById('selAnoFixas').value);
  const keyMes=`${ano}-${String(mes).padStart(2,'0')}`;
  const diaHoje=new Date().getDate();const mesHoje=new Date().getMonth();const anoHoje=new Date().getFullYear();
  const fixasArr=Object.entries(cacheFixas).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.dia-b.dia);
  if(!fixasArr.length){document.getElementById('listaFixas').innerHTML='<div class="empty"><i class="fa fa-repeat"></i><p>Nenhuma conta fixa cadastrada</p></div>';document.getElementById('resumoFixas').innerHTML='';return;}
  const pago=fixasArr.filter(f=>cachePagamentos[keyMes]?.[f._key]);
  const pend=fixasArr.filter(f=>!cachePagamentos[keyMes]?.[f._key]);
  document.getElementById('listaFixas').innerHTML=fixasArr.map(f=>{
    const isPago=!!cachePagamentos[keyMes]?.[f._key];
    const isAtrasado=!isPago&&mes===mesHoje&&ano===anoHoje&&diaHoje>f.dia;
    const sc=isPago?'#22c55e':isAtrasado?'#ef4444':'#f59e0b';
    const badge=isPago?'<span class="badge badge-ok">Pago</span>':isAtrasado?'<span class="badge badge-atras">Atrasado</span>':'<span class="badge badge-pend">Pendente</span>';
    return`<div class="fixa-item"><div class="fixa-status" style="background:${sc}"></div><div style="flex:1;min-width:0"><div class="fixa-nome">${f.nome}</div><div class="fixa-dia">Vence dia ${f.dia} · ${f.cat}</div></div><span class="fixa-valor">${fmtMoeda(f.valor)}</span>${badge}<button onclick="togglePagamento('${f._key}','${keyMes}')" style="margin-left:8px;background:${isPago?'#450a0a':'#14532d'};border:none;border-radius:6px;padding:6px 10px;cursor:pointer;color:${isPago?'#ef4444':'#22c55e'};font-size:12px"><i class="fa ${isPago?'fa-xmark':'fa-check'}"></i></button><button class="lanc-del" onclick="deletarFixa('${f._key}')"><i class="fa fa-trash"></i></button></div>`;
  }).join('');
  const tp=pago.reduce((s,f)=>s+f.valor,0);const tpe=pend.reduce((s,f)=>s+f.valor,0);
  document.getElementById('resumoFixas').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div class="card-sm"><div style="font-size:11px;color:var(--text3);margin-bottom:4px">Total fixas</div><div style="font-family:'DM Mono',monospace;font-size:15px">${fmtMoeda(tp+tpe)}</div></div><div class="card-sm"><div style="font-size:11px;color:#22c55e;margin-bottom:4px">Pagas</div><div style="font-family:'DM Mono',monospace;font-size:15px;color:#22c55e">${fmtMoeda(tp)}</div></div><div class="card-sm"><div style="font-size:11px;color:#f59e0b;margin-bottom:4px">Pendente</div><div style="font-family:'DM Mono',monospace;font-size:15px;color:#f59e0b">${fmtMoeda(tpe)}</div></div></div>`;
}

async function togglePagamento(fixaKey,keyMes){
  const path=`pagamentos/${keyMes}/${fixaKey}`;
  if(cachePagamentos[keyMes]?.[fixaKey])await dbRemove(path);
  else await dbSet(path,true);
}

function abrirModalFixa(key){
  editandoFixaKey=key;
  populateCatSelect('mfCat','Despesa');
  if(key){const f=cacheFixas[key];document.getElementById('mfNome').value=f.nome;document.getElementById('mfValor').value=f.valor;document.getElementById('mfDia').value=f.dia;document.getElementById('mfCat').value=f.cat;document.getElementById('modalFixaTitulo').textContent='Editar conta fixa';}
  else{document.getElementById('mfNome').value='';document.getElementById('mfValor').value='';document.getElementById('mfDia').value='';document.getElementById('modalFixaTitulo').textContent='Nova conta fixa';}
  document.getElementById('modalFixa').classList.add('open');
}

function fecharModal(){document.getElementById('modalFixa').classList.remove('open');}

async function salvarFixa(){
  const nome=document.getElementById('mfNome').value.trim();
  const valor=parseFloat(document.getElementById('mfValor').value);
  const dia=parseInt(document.getElementById('mfDia').value);
  const cat=document.getElementById('mfCat').value;
  if(!nome||!valor||!dia){mostrarToast('Preencha todos os campos.','#ef4444');return;}
  const obj={nome,valor,dia,cat};
  if(editandoFixaKey)await dbSet('fixas/'+editandoFixaKey,obj);
  else await dbPush('fixas',obj);
  fecharModal();mostrarToast('Conta fixa salva!');
}

async function deletarFixa(key){
  if(!confirm('Remover esta conta fixa?'))return;
  await dbRemove('fixas/'+key);mostrarToast('Removida.','#ef4444');
}

async function renderHistorico(){
  const mes=parseInt(document.getElementById('filtMes').value);
  const ano=parseInt(document.getElementById('filtAno').value);
  const tipo=document.getElementById('filtTipo').value;
  const cat=document.getElementById('filtCat').value;
  let lancs=await getLancsMes(mes,ano);
  if(tipo)lancs=lancs.filter(l=>l.tipo===tipo);
  if(cat)lancs=lancs.filter(l=>l.cat===cat);
  lancs.sort((a,b)=>b.data.localeCompare(a.data));
  const el=document.getElementById('listaHist');
  if(!lancs.length){el.innerHTML='<div class="empty"><i class="fa fa-inbox"></i><p>Nenhum lançamento encontrado</p></div>';document.getElementById('totalHist').innerHTML='';return;}
  el.innerHTML=lancs.map(l=>`<div class="lancamento"><div class="lanc-icon" style="background:${l.tipo==='Receita'?'#14532d':'#450a0a'}"><i class="fa ${l.tipo==='Receita'?'fa-arrow-up':'fa-arrow-down'}" style="color:${l.tipo==='Receita'?'#22c55e':'#ef4444'}"></i></div><div class="lanc-info"><div class="lanc-desc">${l.desc}</div><div class="lanc-meta">${l.cat} · ${fmtData(l.data)}</div></div><div class="lanc-valor" style="color:${l.tipo==='Receita'?'#22c55e':'#ef4444'}">${l.tipo==='Receita'?'+':'-'}${fmtMoeda(l.valor)}</div><button class="lanc-del" onclick="deletarLanc('${l._key}').then(()=>renderHistorico())"><i class="fa fa-trash"></i></button></div>`).join('');
  const totalR=lancs.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+l.valor,0);
  const totalD=lancs.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+l.valor,0);
  document.getElementById('totalHist').innerHTML=`<span style="color:#22c55e">+${fmtMoeda(totalR)}</span> <span style="margin:0 6px;color:var(--text3)">·</span> <span style="color:#ef4444">-${fmtMoeda(totalD)}</span> <span style="margin:0 6px;color:var(--text3)">·</span> <strong style="color:${totalR-totalD>=0?'#22c55e':'#ef4444'}">${fmtMoeda(totalR-totalD)}</strong>`;
}

async function exportarDados(){
  const lancs=await getLancamentos();
  const dados={lancamentos:lancs,fixas:cacheFixas,pagamentos:cachePagamentos,exportadoEm:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='financas_familia.json';a.click();
}
</script>
